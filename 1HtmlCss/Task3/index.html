<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task3</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=Sofia">
    </head>
    <body>
        <div class="big">
            <div class="upperBar">
                <h4 class="logo">Food!</h4>
                <nav>
                    <ul class="categories">
                        <li><p class="active_page">BURGERS</p></li>
                        <li><p>PIZZAS</p></li>
                        <li><p>DRINKS</p></li>
                        <li><p>FOOD</p></li>
                    </ul>
                </nav>
                <div class="corner_buttons">
                    <button class="sign_button">🧑🏻‍💻 Sign in</button>
                    <button class="cart_button">🛒</button>

                </div>
            </div>

            <main>
                <div class="info">
                    <h2 class="slogan"><span class="orange_txt">MAKING FOOD
                            GREAT</span> AGAIN AND AGAIN</h2>
                    <p class="description">Lorem ipsum dolor sit amet
                        consectetur adipisicing elit.
                        Cumque aliquam cum excepturi! Incidunt atque est
                        quibusdam
                        quae nobis magni, praesentium sunt dolor facilis vitae
                        </p>
                    <div class="info_buttons">
                        <button class="order_button">Order Now</button>
                        <button class="menu_button">Go To Menu</button>
                    </div>
                </div>
                <div class="adv">
                    <figure>
                        <img src="images/burger2.png" alt="Burger Photo">
                    </figure>
                </div>

            </main>
        </div>
    </body>
</html>
